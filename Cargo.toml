[package]
name = "anet-private-mainnet"
version = "0.1.0"
edition = "2021"

[features]
default = []
abci-testnet = ["dep:bytes", "dep:tendermint-abci", "dep:tendermint-proto"]

[dependencies]
anyhow = "1.0"
axum = "0.7"
bincode = "1.3"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
dotenvy = "0.15"
hex = "0.4"
native-tls = "0.2"
postgres-native-tls = "0.5"
reqwest = { version = "0.11", features = ["json"] }
ripemd = "0.1"
secp256k1 = { version = "0.29", features = ["recovery"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tiny-keccak = { version = "2.0", features = ["keccak"] }
sled = "0.34"
subtle = "2"
tokio = { version = "1.0", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tower-http = { version = "0.5", features = ["cors", "compression-gzip", "compression-deflate"] }
bytes = { version = "1", optional = true }
tendermint-abci = { version = "=0.40.4", optional = true }
tendermint-proto = { version = "=0.40.4", optional = true }